# Vitrail config
# x, y, width, height are percentages of the usable screen area.
# display_setup is generated by the configurator when you capture a setup.

spacing = "1%"
hide_others = true

[[layout]]
name = "perso"
hotkey = "alt+1"

  [[layout.variant]]
  name = "MacBook"
  display_setup = "name=Built-in Retina Display;kind=builtin;primary=1;scale=2;frame=0,0,1512,982"

    [[layout.variant.window]]
    app = "cmux"
    x = 0
    y = 0
    width = 50
    height = 100

    [[layout.variant.window]]
    app = "Google Chrome"
    x = 50
    y = 0
    width = 50
    height = 100

  [[layout.variant]]
  name = "Desk"
  display_setup = "name=Studio Display XDR;kind=external;primary=1;scale=2;frame=-3008,0,3008,1692|name=Built-in Retina Display;kind=builtin;primary=0;scale=2;frame=0,0,1512,982"

    [[layout.variant.window]]
    app = "Slack"
    screen = 1
    x = 0
    y = 0
    width = 50
    height = 100

    [[layout.variant.window]]
    app = "Google Chrome"
    screen = 2
    x = 0
    y = 0
    width = 100
    height = 100

[[layout]]
name = "work"
hotkey = "alt+2"

  [[layout.variant]]
  name = "MacBook"
  display_setup = "name=Built-in Retina Display;kind=builtin;primary=1;scale=2;frame=0,0,1512,982"

    [[layout.variant.window]]
    app = "Terminal"
    x = 0
    y = 0
    width = 50
    height = 100

    [[layout.variant.window]]
    app = "Google Chrome"
    title = "Work"
    x = 50
    y = 0
    width = 50
    height = 100
